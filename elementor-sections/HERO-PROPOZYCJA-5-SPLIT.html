<style>
.split-hero {
    position: relative;
    min-height: 100vh;
    background: #0a0a0a;
    display: flex;
    align-items: center;
    padding: 100px 0 60px;
    margin: 0 calc(-50vw + 50%);
    width: 100vw;
    overflow: hidden;
}

/* Diagonal Split Background */
.split-hero::before {
    content: '';
    position: absolute;
    top: 0;
    right: 0;
    width: 50%;
    height: 100%;
    background: linear-gradient(165deg, #000 0%, #0f0f0f 100%);
    clip-path: polygon(20% 0, 100% 0, 100% 100%, 0 100%);
    z-index: 0;
}

/* Neon Lines */
.neon-lines {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 1;
}

.neon-line {
    position: absolute;
    background: linear-gradient(90deg, transparent, #BFFF00, transparent);
    height: 1px;
    width: 100%;
    opacity: 0.3;
    animation: line-scan 8s linear infinite;
}

.neon-line:nth-child(1) {
    top: 20%;
    animation-delay: 0s;
}

.neon-line:nth-child(2) {
    top: 50%;
    animation-delay: 2.6s;
}

.neon-line:nth-child(3) {
    top: 80%;
    animation-delay: 5.2s;
}

@keyframes line-scan {
    0% {
        transform: scaleX(0);
        opacity: 0;
    }
    50% {
        opacity: 0.5;
    }
    100% {
        transform: scaleX(1);
        opacity: 0;
    }
}

/* Abstract Shapes */
.abstract-shapes {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: 0;
}

.shape {
    position: absolute;
    border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
    opacity: 0.08;
    animation: shape-morph 20s ease-in-out infinite;
}

.shape-1 {
    width: 400px;
    height: 400px;
    background: linear-gradient(135deg, #BFFF00, #00FF87);
    top: 10%;
    right: 15%;
    animation-delay: 0s;
}

.shape-2 {
    width: 300px;
    height: 300px;
    background: linear-gradient(135deg, #00FF87, #00E5FF);
    bottom: 15%;
    left: 10%;
    animation-delay: 6s;
}

@keyframes shape-morph {
    0%, 100% {
        border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
        transform: rotate(0deg);
    }
    50% {
        border-radius: 70% 30% 30% 70% / 70% 70% 30% 30%;
        transform: rotate(180deg);
    }
}

.split-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 20px;
    position: relative;
    z-index: 10;
}

.split-grid {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 100px;
    align-items: center;
}

/* LEFT SIDE */
.split-left {
    max-width: 700px;
}

/* Premium Badge */
.split-badge {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 10px 24px;
    background: rgba(191, 255, 0, 0.1);
    border: 1px solid #BFFF00;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 900;
    color: #BFFF00;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 40px;
    box-shadow: 0 0 20px rgba(191, 255, 0, 0.3);
}

.split-badge::before {
    content: '';
    width: 6px;
    height: 6px;
    background: #BFFF00;
    border-radius: 1px;
    box-shadow: 0 0 8px #BFFF00;
}

/* MEGA Title */
.split-title {
    font-size: 92px;
    font-weight: 900;
    line-height: 0.88;
    letter-spacing: -4px;
    margin-bottom: 32px;
    color: #fff;
}

.split-highlight {
    display: inline;
    background: linear-gradient(135deg, #BFFF00 0%, #00FF87 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    position: relative;
}

/* Glitch Effect */
.split-highlight::before,
.split-highlight::after {
    content: attr(data-text);
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #BFFF00 0%, #00FF87 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    opacity: 0;
}

.split-highlight:hover::before {
    animation: glitch-1 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) both infinite;
}

.split-highlight:hover::after {
    animation: glitch-2 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) reverse both infinite;
}

@keyframes glitch-1 {
    0%, 100% {
        transform: translate(0);
        opacity: 0;
    }
    33% {
        transform: translate(-2px, 2px);
        opacity: 0.8;
    }
    66% {
        transform: translate(2px, -2px);
        opacity: 0.8;
    }
}

@keyframes glitch-2 {
    0%, 100% {
        transform: translate(0);
        opacity: 0;
    }
    33% {
        transform: translate(2px, -2px);
        opacity: 0.8;
    }
    66% {
        transform: translate(-2px, 2px);
        opacity: 0.8;
    }
}

.split-desc {
    font-size: 20px;
    line-height: 1.7;
    color: rgba(255, 255, 255, 0.8);
    margin-bottom: 48px;
    max-width: 580px;
}

/* CTA Buttons */
.split-cta {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
}

.split-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    padding: 22px 48px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 800;
    text-decoration: none;
    transition: all 0.3s ease;
    overflow: hidden;
}

.split-btn::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    transition: left 0.5s;
}

.split-btn:hover::before {
    left: 100%;
}

.split-btn-primary {
    background: #BFFF00;
    color: #000;
    box-shadow: 0 10px 40px rgba(191, 255, 0, 0.4);
}

.split-btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 50px rgba(191, 255, 0, 0.6);
}

.split-btn-secondary {
    background: transparent;
    color: #BFFF00;
    border: 2px solid #BFFF00;
}

.split-btn-secondary:hover {
    background: rgba(191, 255, 0, 0.1);
}

/* RIGHT SIDE - Stacked Cards */
.split-right {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

/* Premium Cards */
.premium-card {
    padding: 40px 36px;
    background: linear-gradient(135deg, rgba(15, 15, 15, 0.95), rgba(20, 20, 20, 0.95));
    border: 1px solid rgba(191, 255, 0, 0.2);
    border-radius: 16px;
    position: relative;
    overflow: hidden;
    transition: all 0.3s ease;
}

.premium-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 4px;
    height: 100%;
    background: linear-gradient(180deg, #BFFF00, #00FF87);
    transform: scaleY(0);
    transform-origin: bottom;
    transition: transform 0.3s ease;
}

.premium-card:hover {
    border-color: #BFFF00;
    transform: translateX(8px);
    box-shadow: -8px 0 30px rgba(191, 255, 0, 0.2);
}

.premium-card:hover::before {
    transform: scaleY(1);
}

.card-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 16px;
}

.card-icon {
    width: 48px;
    height: 48px;
    background: rgba(191, 255, 0, 0.1);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
}

.card-number {
    font-size: 48px;
    font-weight: 900;
    background: linear-gradient(135deg, #BFFF00, #00FF87);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    line-height: 1;
}

.card-label {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.7);
    line-height: 1.5;
    margin-top: 8px;
}

/* Responsive */
@media (max-width: 1024px) {
    .split-grid {
        grid-template-columns: 1fr;
        gap: 70px;
    }
    .split-title {
        font-size: 68px;
    }
    .split-hero::before {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        width: 100%;
    }
}

@media (max-width: 768px) {
    .split-hero {
        padding: 80px 0 60px;
        margin: 0;
        width: 100%;
    }
    .split-title {
        font-size: 46px;
        letter-spacing: -2px;
    }
    .split-desc {
        font-size: 18px;
    }
    .split-btn {
        width: 100%;
        justify-content: center;
    }
    .shape {
        display: none;
    }
}
</style>

<script>
// Minimal counter animation
(function() {
    const nums = document.querySelectorAll('.card-number');

    const run = (el) => {
        const txt = el.textContent;
        const val = parseInt(txt.replace(/[^0-9]/g, ''));
        if (isNaN(val)) return;

        let cur = 0;
        const stp = val / 50;
        const tmr = setInterval(() => {
            cur += stp;
            if (cur >= val) {
                el.textContent = txt;
                clearInterval(tmr);
            } else {
                el.textContent = Math.floor(cur).toLocaleString('pl-PL');
            }
        }, 25);
    };

    const obs = new IntersectionObserver((ents) => {
        ents.forEach(e => {
            if (e.isIntersecting && !e.target.dataset.run) {
                e.target.dataset.run = '1';
                run(e.target);
            }
        });
    }, { threshold: 0.5 });

    nums.forEach(n => obs.observe(n));
})();
</script>
