<!-- BLOG SECTION ULTRA MODERN - Wklej w Elementor Custom HTML -->

<style>
.blog-ultra {
    position: relative;
    background: transparent;
    padding: 140px 20px 120px 20px;
    margin: 0 calc(-50vw + 50%);
    width: 100vw;
    overflow: hidden;
}

/* Neon Scanning Lines */
.blog-ultra .scan-lines {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 1;
}

.blog-ultra .scan-line {
    position: absolute;
    background: linear-gradient(90deg, transparent, #BFFF00, transparent);
    height: 1px;
    width: 100%;
    opacity: 0.3;
    animation: scan-move 8s linear infinite;
}

.blog-ultra .scan-line:nth-child(1) {
    top: 25%;
    animation-delay: 0s;
}

.blog-ultra .scan-line:nth-child(2) {
    top: 55%;
    animation-delay: 2.6s;
}

.blog-ultra .scan-line:nth-child(3) {
    top: 85%;
    animation-delay: 5.2s;
}

@keyframes scan-move {
    0% {
        transform: scaleX(0);
        opacity: 0;
    }
    50% {
        opacity: 0.5;
    }
    100% {
        transform: scaleX(1);
        opacity: 0;
    }
}

/* Morphing Shapes */
.blog-ultra .morph-shapes {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    z-index: 0;
}

.blog-ultra .morph-shape {
    position: absolute;
    border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
    opacity: 0.08;
    animation: morph-animation 20s ease-in-out infinite;
}

.blog-ultra .morph-shape-1 {
    width: 400px;
    height: 400px;
    background: linear-gradient(135deg, #BFFF00, #00FF87);
    top: 15%;
    right: 10%;
    animation-delay: 0s;
}

.blog-ultra .morph-shape-2 {
    width: 350px;
    height: 350px;
    background: linear-gradient(135deg, #00FF87, #00E5FF);
    bottom: 20%;
    left: 8%;
    animation-delay: 6s;
}

@keyframes morph-animation {
    0%, 100% {
        border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
        transform: rotate(0deg);
    }
    50% {
        border-radius: 70% 30% 30% 70% / 70% 70% 30% 30%;
        transform: rotate(180deg);
    }
}

.blog-ultra-container {
    max-width: 1200px;
    margin: 0 auto;
    position: relative;
    z-index: 10;
}

/* Header */
.blog-ultra-header {
    text-align: center;
    margin-bottom: 80px;
}

.blog-ultra-label {
    font-size: 13px;
    font-weight: 700;
    color: #BFFF00;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 32px;
    display: block;
}

.blog-ultra-title {
    font-size: 56px;
    font-weight: 700;
    line-height: 1.2;
    color: #fff;
    margin-bottom: 24px;
}

.blog-ultra-lead {
    font-size: 20px;
    line-height: 1.6;
    color: rgba(255, 255, 255, 0.7);
    max-width: 700px;
    margin: 0 auto 40px auto;
}

/* CTA Button */
.blog-ultra-cta {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 17px;
    font-weight: 800;
    color: #fff;
    text-decoration: none;
    padding: 18px 40px;
    background: linear-gradient(135deg, rgba(191, 255, 0, 0.15), rgba(0, 255, 135, 0.15));
    border: 2px solid rgba(191, 255, 0, 0.4);
    border-radius: 4px;
    transition: all 0.4s;
    position: relative;
    overflow: hidden;
}

.blog-ultra-cta::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(191, 255, 0, 0.2), transparent);
    transition: left 0.6s;
}

.blog-ultra-cta:hover::before {
    left: 100%;
}

.blog-ultra-cta:hover {
    background: rgba(191, 255, 0, 0.25);
    border-color: #BFFF00;
    transform: translateY(-2px);
    box-shadow: 0 10px 40px rgba(191, 255, 0, 0.3);
}

/* Responsive */
@media (max-width: 768px) {
    .blog-ultra {
        padding: 100px 20px 80px 20px;
        margin: 0;
        width: 100%;
    }

    .blog-ultra-title {
        font-size: 38px;
    }

    .blog-ultra-lead {
        font-size: 18px;
    }

    .blog-ultra-cta {
        width: 100%;
        justify-content: center;
    }
}
</style>

<div class="blog-ultra">
    <!-- Background effects -->
    <div class="scan-lines">
        <div class="scan-line"></div>
        <div class="scan-line"></div>
        <div class="scan-line"></div>
    </div>

    <div class="morph-shapes">
        <div class="morph-shape morph-shape-1"></div>
        <div class="morph-shape morph-shape-2"></div>
    </div>

    <div class="blog-ultra-container">

        <!-- Header -->
        <div class="blog-ultra-header">
            <span class="blog-ultra-label">Blog</span>
            <h2 class="blog-ultra-title">
                Wiedza z marketingu online<br>i rozwoju stron
            </h2>
            <p class="blog-ultra-lead">
                Praktyczne porady, case studies i najnowsze trendy w SEO, Google Ads, social media i WordPress. Artykuły oparte na doświadczeniach z realnych projektów.
            </p>
            <a href="https://socialmagic.pl/blog/" class="blog-ultra-cta">
                <span>Zobacz wszystkie artykuły</span>
                <span>→</span>
            </a>
        </div>

    </div>
</div>
